          description: '403'
          content:
            application/json:
              examples:
                Invalid Scope:
                  value: "{\n    \"message\": \"This route cannot be accessed with the provided scopes.\"\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: This route cannot be accessed with the provided scopes.
      deprecated: false
