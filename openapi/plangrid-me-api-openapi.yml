      summary: Get User Profile
      description: Get the user profile associated with the token or API key.
      operationId: get-user-profile
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"uid\": \"67ea8cedcc118902797dd3be\",\n    \"email\": \"betty@construction.com\",\n    \"first_name\": \"Betty\",\n    \"last_name\": \"Builder\"\n}"
              schema:
                type: object
                properties:
                  uid:
                    type: string
                    example: 67ea8cedcc118902797dd3be
                  email:
                    type: string
                    example: betty@construction.com
                  first_name:
                    type: string
                    example: Betty
                  last_name:
                    type: string
                    example: Builder
