                          properties:
                            type:
                              type: string
                              example: user
                            uid:
                              type: string
                              example: 5c48e3dca97740498aed0692
                            url:
                              type: string
                              example: https://io.plangrid.com/projects/6f27e34d-3697-0ba7-df37-67045591b53b/users/5c48e3dca97740498aed0692
                        is_draft:
                          type: boolean
                          example: false
                          default: true
                        num_references_on_create:
                          type: integer
                          example: 0
