name: PlanGrid

description: PlanGrid is a construction productivity platform (now part of Autodesk Construction Cloud) that gives field and office teams access
  to construction drawings, sheets, documents, photos, RFIs, submittals, field reports, tasks, and punch lists on web and mobile. The PlanGrid
  API is a REST API served from io.plangrid.com that lets developers programmatically manage projects, annotations, comments, documents, photos,
  sheets and versions, snapshots, RFIs, submittal packages, field reports, tasks and task lists, roles, and project team users. It supports OAuth
  2.0 (authorization code and implicit grants) as well as HTTP Basic API-key authentication, media-type versioning via the Accept header, cursor-based
  pagination, batch requests, and multi-step file upload workflows for PDFs, photos, and documents.

